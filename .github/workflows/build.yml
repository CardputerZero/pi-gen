name: Build CardputerZero OS Image (arm64)

on:
  push:
    branches: [arm64, cardputerzero_v0.6]
  workflow_dispatch:
    inputs:
      applaunch_deb_url:
        description: Fixed APPLaunch arm64 deb asset URL
        required: false
      recorder_deb_url:
        description: Fixed Recorder arm64 deb asset URL
        required: false
      expected_applaunch_version:
        description: Debian version expected inside the image
        required: false

permissions:
  contents: write

env:
  APPLAUNCH_DEB_URL: ${{ inputs.applaunch_deb_url || vars.APPLAUNCH_DEB_URL }}
  RECORDER_DEB_URL: ${{ inputs.recorder_deb_url || vars.RECORDER_DEB_URL }}
  EXPECTED_APPLAUNCH_VERSION: ${{ inputs.expected_applaunch_version || vars.EXPECTED_APPLAUNCH_VERSION }}
  COMPASS_DEB_URL: ${{ vars.COMPASS_DEB_URL }}
  CAMERA_APP_DEB_URL: ${{ vars.CAMERA_APP_DEB_URL }}
  FACTORY_TEST_DEB_URL: ${{ vars.FACTORY_TEST_DEB_URL }}
  FILES_DEB_URL: ${{ vars.FILES_DEB_URL }}
  MUSIC_DEB_URL: ${{ vars.MUSIC_DEB_URL }}
  IR_CHAT_DEB_URL: ${{ vars.IR_CHAT_DEB_URL }}
  PIANO_DEB_URL: ${{ vars.PIANO_DEB_URL }}
  IR_REMOTE_DEB_URL: ${{ vars.IR_REMOTE_DEB_URL }}
  CAP_CC1101_SUBG_CHAT_DEB_URL: ${{ vars.CAP_CC1101_SUBG_CHAT_DEB_URL }}
  CAP_CC1101_NFC_DEB_URL: ${{ vars.CAP_CC1101_NFC_DEB_URL }}
  CAP_LORA_1262_GPS_DEB_URL: ${{ vars.CAP_LORA_1262_GPS_DEB_URL }}
  KEYBOARD_GUIDE_DEB_URL: ${{ vars.KEYBOARD_GUIDE_DEB_URL }}
  OSS_ENABLED: ${{ secrets.OSS_ACCESS_KEY_ID != '' && secrets.OSS_ACCESS_KEY_SECRET != '' }}

jobs:
  build-desktop:
    name: Build desktop image (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        run: |
          set -euo pipefail
          test -n "$APPLAUNCH_DEB_URL" || {
            echo "Set APPLAUNCH_DEB_URL as a workflow input or repository variable"
            exit 1
          }
          test -n "$EXPECTED_APPLAUNCH_VERSION" || {
            echo "Set EXPECTED_APPLAUNCH_VERSION as a workflow input or repository variable"
            exit 1
          }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test qemu-user-static kmod binfmt-support e2fsprogs

      - name: Configure build
        run: |
          IMG_DATE=$(date -u +%Y-%m-%d)
          cat > config <<CONFIG
          IMG_NAME=cardputerzero-trixie-arm64
          IMG_FILENAME=${IMG_DATE}-cardputerzero-trixie-arm64
          ARCHIVE_FILENAME=${IMG_DATE}-cardputerzero-trixie-arm64
          RELEASE=trixie
          DEPLOY_COMPRESSION=xz
          TARGET_HOSTNAME=cardputerzero
          FIRST_USER_NAME=pi
          FIRST_USER_PASS=raspberry
          DISABLE_FIRST_BOOT_USER_RENAME=1
          ENABLE_SSH=1
          LOCALE_DEFAULT=en_US.UTF-8
          KEYBOARD_KEYMAP=us
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT=Asia/Shanghai
          STAGE_LIST="stage0 stage1 stage2 stage3 stage4"
          CONFIG
          sed -i 's/^          //' config
          touch stage5/SKIP stage5/SKIP_IMAGES

      - name: Build image
        run: |
          sudo env \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            XZ_DEFAULTS="-T0" \
            APPLAUNCH_DEB_URL="$APPLAUNCH_DEB_URL" \
            RECORDER_DEB_URL="$RECORDER_DEB_URL" \
            COMPASS_DEB_URL="$COMPASS_DEB_URL" \
            CAMERA_APP_DEB_URL="$CAMERA_APP_DEB_URL" \
            FACTORY_TEST_DEB_URL="$FACTORY_TEST_DEB_URL" \
            FILES_DEB_URL="$FILES_DEB_URL" \
            MUSIC_DEB_URL="$MUSIC_DEB_URL" \
            IR_CHAT_DEB_URL="$IR_CHAT_DEB_URL" \
            PIANO_DEB_URL="$PIANO_DEB_URL" \
            IR_REMOTE_DEB_URL="$IR_REMOTE_DEB_URL" \
            CAP_CC1101_SUBG_CHAT_DEB_URL="$CAP_CC1101_SUBG_CHAT_DEB_URL" \
            CAP_CC1101_NFC_DEB_URL="$CAP_CC1101_NFC_DEB_URL" \
            CAP_LORA_1262_GPS_DEB_URL="$CAP_LORA_1262_GPS_DEB_URL" \
            KEYBOARD_GUIDE_DEB_URL="$KEYBOARD_GUIDE_DEB_URL" \
            ./build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.APP_RELEASES_TOKEN || github.token }}

      - name: Fix deploy permissions
        run: sudo chown -R $(id -u):$(id -g) deploy/

      - name: Find output image
        id: image
        run: |
          set -euo pipefail
          echo "Contents of deploy/:"
          find deploy/ -type f | sort
          FILE=$(find deploy/ -maxdepth 1 -type f -name "*.img.xz" \
            ! -name "*-lite*" | head -1)
          test -n "$FILE" || {
            echo "No desktop image found"
            exit 1
          }
          IMG_RAW="${FILE%.xz}"
          xz -dk "$FILE"
          INFO_FILE="${FILE%.img.xz}.info"
          test -f "$INFO_FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "raw=$IMG_RAW" >> "$GITHUB_OUTPUT"
          echo "info=$INFO_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE" "$IMG_RAW" "$INFO_FILE"

      - name: Verify full image contents
        run: |
          set -o pipefail
          sudo env \
            VERIFY_PROFILE=full \
            EXPECTED_APPLAUNCH_VERSION="$EXPECTED_APPLAUNCH_VERSION" \
            ./tools/verify-image.sh "${{ steps.image.outputs.raw }}" 2>&1 | \
            tee deploy/full-image-verification.log

      - name: Prepare release metadata
        id: metadata
        run: |
          set -euo pipefail
          FILE="${{ steps.image.outputs.path }}"
          SHA_FILE="${FILE}.sha256"
          (cd "$(dirname "$FILE")" && \
            sha256sum "$(basename "$FILE")" > "$(basename "$SHA_FILE")" && \
            sha256sum -c "$(basename "$SHA_FILE")")

          IMAGE_SHA=$(awk '{print $1}' "$SHA_FILE")
          LAUNCHER_VERSION=$(grep -oE 'applaunch package installed \(v[^)]+\)' \
            deploy/full-image-verification.log | sed -E 's/.*\(v([^)]+)\)/\1/' | head -1)
          DRIVER_COMMIT=$(grep -oE 'dtoverlays source commit recorded \([0-9a-f]{40}\)' \
            deploy/full-image-verification.log | grep -oE '[0-9a-f]{40}' | head -1)
          KERNEL_VERSION=$(awk '$2 == "linux-image-rpi-v8" { print $3; exit }' \
            "${{ steps.image.outputs.info }}")
          test -n "$LAUNCHER_VERSION"
          test -n "$DRIVER_COMMIT"
          test -n "$KERNEL_VERSION"

          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"
          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "launcher_version=$LAUNCHER_VERSION" >> "$GITHUB_OUTPUT"
          echo "driver_commit=$DRIVER_COMMIT" >> "$GITHUB_OUTPUT"
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

          cat > deploy/build-info.json <<EOF
          {
            "pigen_commit": "${GITHUB_SHA}",
            "launcher_version": "${LAUNCHER_VERSION}",
            "launcher_deb_url": "${APPLAUNCH_DEB_URL}",
            "kernel_version": "${KERNEL_VERSION}",
            "driver_commit": "${DRIVER_COMMIT}",
            "image_name": "${{ steps.image.outputs.name }}",
            "image_sha256": "${IMAGE_SHA}",
            "config_cardputero_v0_5": true,
            "verify_profile": "full"
          }
          EOF

      - name: Upload verified desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-desktop
          path: |
            ${{ steps.image.outputs.path }}
            ${{ steps.metadata.outputs.sha_file }}
            ${{ steps.image.outputs.info }}
            deploy/full-image-verification.log
            deploy/build-info.json

      - name: Create prerelease
        id: release
        run: |
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG" \
            --notes "Built from pi-gen commit ${GITHUB_SHA}

          **Components:**
          - Launcher (APPLaunch): ${{ steps.metadata.outputs.launcher_version }}
          - Kernel: ${{ steps.metadata.outputs.kernel_version }}
          - Driver overlay: m5stack/m5stack-linux-dtoverlays @ ${{ steps.metadata.outputs.driver_commit }}
          - Image SHA-256: ${{ steps.metadata.outputs.image_sha }}
          - CONFIG_CARDPUTERO_V0_5: y (enabled)" \
            "${{ steps.image.outputs.path }}" \
            "${{ steps.metadata.outputs.sha_file }}" \
            "${{ steps.image.outputs.info }}" \
            deploy/full-image-verification.log \
            deploy/build-info.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure Aliyun OSS
        if: ${{ env.OSS_ENABLED == 'true' }}
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: oss-cn-shenzhen.aliyuncs.com
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Copy verified image to OSS
        if: ${{ env.OSS_ENABLED == 'true' }}
        run: |
          OSS_URL="https://cardputer-zero-repo.oss-cn-shenzhen.aliyuncs.com/images/${{ steps.image.outputs.name }}"
          ossutil cp -f "${{ steps.image.outputs.path }}" \
            "oss://cardputer-zero-repo/images/${{ steps.image.outputs.name }}"
          ossutil cp -f "${{ steps.metadata.outputs.sha_file }}" \
            "oss://cardputer-zero-repo/images/$(basename "${{ steps.metadata.outputs.sha_file }}")"
          CURRENT_NOTES=$(gh release view "${{ steps.release.outputs.tag }}" \
            --json body --jq .body)
          gh release edit "${{ steps.release.outputs.tag }}" \
            --notes "${CURRENT_NOTES}

          **OSS Download:** [${OSS_URL}](${OSS_URL})"
        env:
          GH_TOKEN: ${{ github.token }}

  check-lite:
    name: Verify lite build (no release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        run: |
          set -euo pipefail
          test -n "$APPLAUNCH_DEB_URL"
          test -n "$EXPECTED_APPLAUNCH_VERSION"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test qemu-user-static kmod binfmt-support e2fsprogs

      - name: Configure lite build
        run: |
          cat > config <<'CONFIG'
          IMG_NAME=cardputerzero-trixie-arm64
          RELEASE=trixie
          DEPLOY_COMPRESSION=xz
          TARGET_HOSTNAME=cardputerzero
          FIRST_USER_NAME=pi
          FIRST_USER_PASS=raspberry
          DISABLE_FIRST_BOOT_USER_RENAME=1
          ENABLE_SSH=1
          LOCALE_DEFAULT=en_US.UTF-8
          KEYBOARD_KEYMAP=us
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT=Asia/Shanghai
          STAGE_LIST="stage0 stage1 stage2"
          CONFIG
          sed -i 's/^          //' config
          touch stage3/SKIP stage4/SKIP stage5/SKIP
          touch stage3/SKIP_IMAGES stage4/SKIP_IMAGES stage5/SKIP_IMAGES

      - name: Build lite image
        run: |
          sudo env \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            XZ_DEFAULTS="-T0" \
            APPLAUNCH_DEB_URL="$APPLAUNCH_DEB_URL" \
            RECORDER_DEB_URL="$RECORDER_DEB_URL" \
            COMPASS_DEB_URL="$COMPASS_DEB_URL" \
            CAMERA_APP_DEB_URL="$CAMERA_APP_DEB_URL" \
            FACTORY_TEST_DEB_URL="$FACTORY_TEST_DEB_URL" \
            FILES_DEB_URL="$FILES_DEB_URL" \
            MUSIC_DEB_URL="$MUSIC_DEB_URL" \
            IR_CHAT_DEB_URL="$IR_CHAT_DEB_URL" \
            PIANO_DEB_URL="$PIANO_DEB_URL" \
            IR_REMOTE_DEB_URL="$IR_REMOTE_DEB_URL" \
            CAP_CC1101_SUBG_CHAT_DEB_URL="$CAP_CC1101_SUBG_CHAT_DEB_URL" \
            CAP_CC1101_NFC_DEB_URL="$CAP_CC1101_NFC_DEB_URL" \
            CAP_LORA_1262_GPS_DEB_URL="$CAP_LORA_1262_GPS_DEB_URL" \
            KEYBOARD_GUIDE_DEB_URL="$KEYBOARD_GUIDE_DEB_URL" \
            ./build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.APP_RELEASES_TOKEN || github.token }}

      - name: Fix deploy permissions
        run: sudo chown -R $(id -u):$(id -g) deploy/

      - name: Find lite image
        id: lite
        run: |
          set -euo pipefail
          FILE=$(find deploy/ -maxdepth 1 -type f -name "*-lite.img.xz" | head -1)
          test -n "$FILE"
          xz -dk "$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "raw=${FILE%.xz}" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE" "${FILE%.xz}"

      - name: Verify lite image contents
        run: |
          sudo env \
            VERIFY_PROFILE=lite \
            EXPECTED_APPLAUNCH_VERSION="$EXPECTED_APPLAUNCH_VERSION" \
            ./tools/verify-image.sh "${{ steps.lite.outputs.raw }}"

      - name: Upload verified lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-lite
          path: ${{ steps.lite.outputs.path }}
