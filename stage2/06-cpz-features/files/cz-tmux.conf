set -g default-terminal "screen-256color"
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-style "bg=colour0,fg=colour7"
set -g status-left "#(/usr/local/bin/cz-status 36)"
set -g status-left-length 36
set -g status-right "#[fg=colour3]Alt+B: main menu"
set -g status-right-length 16
setw -g window-status-format ""
setw -g window-status-current-format ""
set -g escape-time 0
# Alt+B detaches tmux and returns to the cz main menu (session kept running).
bind -n M-b detach-client
set -g mouse off
set -g history-limit 2000
setw -g automatic-rename on
