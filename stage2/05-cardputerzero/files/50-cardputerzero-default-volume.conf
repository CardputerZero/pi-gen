# CardputerZero factory default output volume.
#
# WirePlumber's stock default for a never-seen sink is 0.064 linear (40% on
# the cubic UI scale, about -24 dB). On this device the only gain stage is the
# ES8389 DAC attenuator (the speaker amplifier is a plain GPIO switch), so the
# stock default makes the first-boot keyboard guide and OOBE barely audible
# (bug #262). Set the factory default to 60% UI volume (0.216 linear,
# about -13.4 dB). Once the user touches the volume once, WirePlumber persists
# their choice in the per-user state file and this default no longer applies.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.216
}
