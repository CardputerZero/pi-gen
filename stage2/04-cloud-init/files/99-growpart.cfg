# Enable automatic partition + filesystem expansion on first boot.
# The default cloud.cfg from rpi-cloud-init-mods does NOT include growpart/resizefs
# in the modules list (it relies on rpi-resize + systemd-repart, which only works
# on GPT, not MBR). Since pi-gen produces MBR images, we must explicitly add
# cloud-init's growpart + resizefs modules so the root partition fills the SD card.

# Add missing modules to the init stage
cloud_init_modules:
  - growpart
  - resizefs

# growpart configuration
growpart:
  mode: auto
  devices: ['/']

# resize_rootfs: ensures resize2fs runs after growpart
resize_rootfs: true
